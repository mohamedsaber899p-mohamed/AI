<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perice AI</title>
  <style>
    :root {
      --bg: #030712;
      --panel: #0f172a;
      --border: #1e293b;
      --text: #f1f5f9;
      --accent: #a855f7;
      --glow: 0 0 8px var(--accent), 0 0 20px var(--accent), 0 0 40px var(--accent);
    }
    
    body.no-neon {
      --glow: none;
    }
    
    body.no-neon * {
      box-shadow: none !important;
      text-shadow: none !important;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh
    }
    
    header {
      background: linear-gradient(180deg, var(--panel), #0a1220);
      padding: 12px 50px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      position: relative
    }
    
    header h1 {
      color: var(--accent);
      font-size: 18px;
      text-shadow: var(--glow);
      letter-spacing: 1px
    }
    
    #settingsBtn {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: #0f1a2e;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 7px;
      border-radius: 12px;
      box-shadow: var(--glow);
      cursor: pointer
    }
    
    #settingsBtn svg {
      width: 18px;
      height: 18px
    }
    
    #settingsPanel {
      position: absolute;
      top: 60px;
      left: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      width: 310px;
      display: none;
      z-index: 20;
      max-height: 85vh;
      overflow-y: auto;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    #settingsPanel.show {
      display: block
    }
    
    #settingsPanel h3 {
      margin: 16px 0 10px 0;
      font-size: 12px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px
    }
    
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border)
    }
    
    .toggle-row:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0
    }
    
    .switch {
      width: 46px;
      height: 24px;
      background: #334155;
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      transition: 0.3s
    }
    
    .switch.active {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent)
    }
    
    .switch::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: 0.3s
    }
    
    .switch.active::after {
      left: 25px
    }
    
    select,
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0a1220;
      color: var(--text);
      outline: none;
      font-size: 13px
    }
    
    .help-text {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 5px;
      line-height: 1.4;
    }
    
    .colors {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
      justify-content: center
    }
    
    .color {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      box-shadow: 0 0 12px currentColor
    }
    
    .color.active {
      border: 2px solid #fff;
      transform: scale(1.1)
    }
    
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }
    
    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.6;
      animation: fadeIn 0.3s;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px)
      }
      to {
        opacity: 1;
        transform: translateY(0)
      }
    }
    
    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      color: #fff;
      box-shadow: var(--glow);
      font-weight: 600
    }
    
    .ai {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--accent)40;
      box-shadow: 0 0 15px var(--accent)20
    }
    
    .msg img,
    .msg video {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 8px;
      border: 2px solid var(--accent)
    }
    
    #input-area {
      padding: 10px;
      background: var(--panel);
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
      position: relative
    }
    
    #plusBtn,
    #micBtn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #0f1a2e;
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--glow);
      flex-shrink: 0;
      transition: 0.2s
    }
    
    #plusBtn:hover,
    #micBtn:hover {
      transform: scale(1.05)
    }
    
    #plusBtn svg,
    #micBtn svg {
      width: 18px;
      height: 18px
    }
    
    #micBtn.recording {
      background: #ff2d55;
      color: #fff;
      animation: pulse 1s infinite
    }
    
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 12px #ff2d55 }
      50% { box-shadow: 0 0 25px #ff2d55 }
    }
    
    #attachMenu {
      position: absolute;
      bottom: 60px;
      left: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px;
      width: 220px;
      display: none;
      z-index: 15;
      box-shadow: 0 0 25px var(--accent)50;
      backdrop-filter: blur(10px)
    }
    
    #attachMenu.show {
      display: block
    }
    
    .attachItem {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      transition: 0.2s
    }
    
    .attachItem:hover {
      background: #1e293b;
      color: var(--accent)
    }
    
    .attachItem svg {
      width: 16px;
      height: 16px
    }
    
    input[type="text"] {
      flex: 1;
      padding: 11px 16px;
      border-radius: 24px;
      border: 1px solid #334155;
      background: #0a1220;
      color: var(--text);
      outline: none;
      font-size: 14px
    }
    
    .send {
      padding: 11px 20px;
      border-radius: 24px;
      border: none;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--glow);
      flex-shrink: 0;
      font-size: 13px
    }
  </style>
</head>

<body>
  
  <header>
    <button id="settingsBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </button>
    <h1 id="appTitle">PERICE AI</h1>
  </header>
  
  <div id="settingsPanel">
    <div class="toggle-row">
      <span>Effet Néon</span>
      <div class="switch active" id="neonSwitch"></div>
    </div>
    
    <div class="toggle-row">
      <span>Mémoire</span>
      <div class="switch active" id="memorySwitch"></div>
    </div>
    
    <h3>PERSONNALITÉ</h3>
    <select id="personality">
      <option value="Équilibré">⚡ Équilibré</option>
      <option value="Créatif">🎨 Créatif</option>
      <option value="Professeur">📚 Professeur</option>
      <option value="Gamer">🎮 Gamer</option>
    </select>
    
    <h3>COULEUR</h3>
    <div class="colors">
      <div class="color" style="background:#00f7ff" data-color="#00f7ff"></div>
      <div class="color" style="background:#ff2d55" data-color="#ff2d55"></div>
      <div class="color active" style="background:#a855f7" data-color="#a855f7"></div>
      <div class="color" style="background:#00ff88" data-color="#00ff88"></div>
      <div class="color" style="background:#ffaa00" data-color="#ffaa00"></div>
    </div>
    
    <h3>GEMINI API KEY</h3>
    <input type="password" id="apiKeyInput" placeholder="الصق مفتاح API هنا...">
    <p class="help-text">الصق مفتاحك هنا ليعمل الذكاء الاصطناعي الحقيقي فوراً.</p>
  </div>
  
  <div id="chat"></div>
  
  <div id="input-area">
    <button id="plusBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>
    
    <button id="micBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 2a3 3 0 00-3 3v7a3 3 0 006 0V5a3 3 0 00-3-3z" />
        <path d="M19 10v2a7 7 0 01-14 0v-2" />
        <path d="M12 19v3M8 22h8" />
      </svg>
    </button>
    
    <div id="attachMenu">
      <div class="attachItem" id="btnFilmer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 7l-7 5 7 5V7z" />
          <rect x="1" y="5" width="15" height="14" rx="3" />
        </svg>
        Filmer
      </div>
      
      <div class="attachItem" id="btnVoix">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 9a3 3 0 106 0 3 3 0 00-6 0z" />
          <path d="M12 12v3M8 15h8" />
        </svg>
        Voix
      </div>
      
      <div class="attachItem" id="btnGalerie">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="4" />
          <circle cx="9" cy="9" r="2" />
          <path d="M21 15l-3.086-3.086a2 2 0 00-2.828 0L6 21" />
        </svg>
        Galerie
      </div>
      
      <div class="attachItem" id="btnImage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 19l7-7 3 3-7 7-3-3z" />
          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
        </svg>
        Créer une image
      </div>
    </div>
    
    <input type="text" id="userInput" placeholder="Tape ton message...">
    <button class="send" id="sendBtn">SEND</button>
  </div>
  
  <input type="file" id="fileInput" accept="image/*" style="display:none">
  
  <script>
    let settings = {
      neon: true,
      memory: true,
      personality: "Équilibré",
      apiKey: "",
      accent: "#a855f7"
    };
    let history = [];
    let recognition;
    
    const apiKeyInput = document.getElementById("apiKeyInput");
    
    function loadSettings() {
      const saved = localStorage.getItem('periceAI_settings');
      if (saved) {
        settings = { ...settings, ...JSON.parse(saved) };
        document.getElementById('neonSwitch').classList.toggle('active', settings.neon);
        document.getElementById('memorySwitch').classList.toggle('active', settings.memory);
        document.getElementById('personality').value = settings.personality;
        apiKeyInput.value = settings.apiKey || localStorage.getItem("gemini_api_key") || "";
        document.body.classList.toggle('no-neon', !settings.neon);
        document.documentElement.style.setProperty('--accent', settings.accent);
        document.documentElement.style.setProperty('--glow', `0 0 8px ${settings.accent}, 0 0 20px ${settings.accent}, 0 0 40px ${settings.accent}`);
        document.querySelectorAll('.color').forEach(c => {
          c.classList.toggle('active', c.dataset.color === settings.accent);
        });
        if (settings.memory) {
          const savedHistory = localStorage.getItem('periceAI_history');
          if (savedHistory) history = JSON.parse(savedHistory);
        }
      } else {
        apiKeyInput.value = localStorage.getItem("gemini_api_key") || "";
      }
    }
    
    function saveSettings() {
      settings.apiKey = apiKeyInput.value.trim();
      localStorage.setItem('periceAI_settings', JSON.stringify(settings));
      localStorage.setItem('gemini_api_key', settings.apiKey);
      if (settings.memory) {
        localStorage.setItem('periceAI_history', JSON.stringify(history));
      }
    }
    
    apiKeyInput.oninput = saveSettings;
    
    function addMessage(text, sender, type = "text") {
      const div = document.createElement("div");
      div.className = "msg " + sender;
      if (type === "image") div.innerHTML = `<img src="${text}">`;
      else if (type === "video") div.innerHTML = `<video src="${text}" controls></video>`;
      else div.textContent = text;
      document.getElementById("chat").appendChild(div);
      document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
    }
    
    async function sendMessage() {
      const message = document.getElementById("userInput").value.trim();
      const apiKey = apiKeyInput.value.trim() || localStorage.getItem("gemini_api_key");
      
      if (!message) return;
      
      if (!apiKey) {
        addMessage("⚠️ تنبيه: يرجى فتح الإعدادات ⚙️ وإدخال مفتاح Gemini API الخاص بك لكي يرد عليك الذكاء الاصطناعي الحقيقي.", "ai");
        document.getElementById("settingsPanel").classList.add("show");
        return;
      }
      
      addMessage(message, "user");
      document.getElementById("userInput").value = "";
      if (settings.memory) history.push({ role: "user", content: message });
      
      const loadingId = "load_" + Date.now();
      const loadDiv = document.createElement("div");
      loadDiv.className = "msg ai";
      loadDiv.id = loadingId;
      loadDiv.textContent = "جاري الاتصال بسيرفرات Google الحقيقية...";
      document.getElementById("chat").appendChild(loadDiv);
      
      try {
        // الاتصال بموديل Gemini 3.8/1.5/2.5 مباشرة بدون سيرفرات خارجية معقدة
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `الوضع الحالي للشخصية (${settings.personality}): ${message}` }] }]
          })
        });
        
        const data = await res.json();
        document.getElementById(loadingId).remove();
        
        if (data.candidates && data.candidates[0].content) {
          const reply = data.candidates[0].content.parts[0].text;
          addMessage(reply, "ai");
          if (settings.memory) history.push({ role: "assistant", content: reply });
          saveSettings();
        } else if (data.error) {
          addMessage("خطأ من السيرفر: " + data.error.message, "ai");
        } else {
          addMessage("عذراً، تأكد من صحة مفتاح الـ API.", "ai");
        }
      } catch (e) {
        document.getElementById(loadingId).remove();
        addMessage("فشل الاتصال بالشبكة، تأكد من اتصال الإنترنت.", "ai");
      }
    }
    
    if ('webkitSpeechRecognition' in window) {
      recognition = new webkitSpeechRecognition();
      recognition.lang = 'ar-SA';
      recognition.onresult = (e) => {
        document.getElementById("userInput").value = e.results[0][0].transcript;
        document.getElementById("micBtn").classList.remove("recording");
      };
      recognition.onend = () => {
        document.getElementById("micBtn").classList.remove("recording");
      };
    }
    
    document.getElementById("micBtn").onclick = () => {
      if (!recognition) {
        alert("Reconnaissance vocale non supportée. Utilise Chrome Android.");
        return;
      }
      if (document.getElementById("micBtn").classList.contains("recording")) {
        recognition.stop();
      } else {
        recognition.start();
        document.getElementById("micBtn").classList.add("recording");
      }
    };
    
    document.getElementById("plusBtn").onclick = () => {
      document.getElementById("attachMenu").classList.toggle("show");
    };
    
    document.getElementById("btnFilmer").onclick = async () => {
      document.getElementById("attachMenu").classList.remove("show");
      alert("Caméra: fonctionnalité active.");
    };
    
    document.getElementById("btnVoix").onclick = async () => {
      document.getElementById("attachMenu").classList.remove("show");
      alert("Voix: fonctionnalité active.");
    };
    
    document.getElementById("btnGalerie").onclick = () => {
      document.getElementById("attachMenu").classList.remove("show");
      document.getElementById("fileInput").click();
    };
    
    document.getElementById("fileInput").onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => addMessage(ev.target.result, "user", "image");
        reader.readAsDataURL(file);
      }
    };
    
    document.getElementById("btnImage").onclick = async () => {
      document.getElementById("attachMenu").classList.remove("show");
      const promptText = prompt("Décris l'image à créer :");
      if (!promptText) return;
      addMessage(`Génération: ${promptText}`, "user");
      addMessage("تم استلام طلب الصورة، جارٍ ربط مولد الصور.", "ai");
    };
    
    document.getElementById("settingsBtn").onclick = () => {
      document.getElementById("settingsPanel").classList.toggle("show");
    };
    
    document.getElementById("neonSwitch").onclick = function() {
      this.classList.toggle("active");
      settings.neon = this.classList.contains("active");
      document.body.classList.toggle('no-neon', !settings.neon);
      saveSettings();
    };
    
    document.getElementById("memorySwitch").onclick = function() {
      this.classList.toggle("active");
      settings.memory = this.classList.contains("active");
      if (!settings.memory) history = [];
      saveSettings();
    };
    
    document.getElementById("personality").onchange = function() {
      settings.personality = this.value;
      saveSettings();
    };
    
    document.querySelectorAll(".color").forEach(c => {
      c.onclick = function() {
        document.querySelectorAll(".color").forEach(x => x.classList.remove("active"));
        this.classList.add("active");
        settings.accent = this.dataset.color;
        document.documentElement.style.setProperty('--accent', settings.accent);
        document.documentElement.style.setProperty('--glow', `0 0 8px ${settings.accent}, 0 0 20px ${settings.accent}, 0 0 40px ${settings.accent}`);
        saveSettings();
      };
    });
    
    document.getElementById("sendBtn").onclick = sendMessage;
    document.getElementById("userInput").onkeypress = (e) => {
      if (e.key === "Enter") sendMessage();
    };
    
    loadSettings();
    addMessage("Perice AI متصل وجاهز للعمل. افتح الإعدادات ⚙️ وأدخل مفتاح الـ API الخاص بك لبدء المحادثة.", "ai");
  </script>
</body>

</html>

name: HTML to APK Builder

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Download Apache Cordova / Build Tools
        run: |
          npm install -g cordova

      - name: Create Cordova Project & Build APK
        run: |
          cordova create myApp com.perice.ai PericeAI
          cd myApp
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          cordova platform add android
          cordova build android --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v2
        with:
          name: Perice-AI-APK
          path: myApp/platforms/android/app/build/outputs/apk/release/

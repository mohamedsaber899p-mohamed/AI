name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install Cordova CLI
      run: npm install -g cordova

    - name: Create Cordova Project Structure
      run: |
        cordova telemetry off
        cordova create temp_app com.perice.ai PericeAI
        cd temp_app
        rm -rf www/*
        cp -r ../index.html www/
        if [ -f "../config.xml" ]; then cp ../config.xml ./; fi
        if [ -f "../icon.png" ]; then cp ../icon.png ./; fi
        
        cordova platform add android
        cordova build android --release

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: Perice-AI-APK
        path: temp_app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
